{% extends "base.html" %}
{% block main %}
<main id="main" class="relative min-h-[80vh] overflow-hidden px-4 py-16">
  <div class="mist-bg opacity-60"></div>
  <div class="relative mx-auto max-w-3xl">
    <p class="label text-peach-deep">Whitelist</p>
    <h1 class="mt-1 font-display text-5xl font-semibold md:text-7xl">Check your <em class="text-sky">status.</em></h1>
    <p class="mt-3 max-w-lg text-current/70">Paste your wallet or X username. Your card shows Pending review until the judgment, then GTD or FCFS.</p>
    <div class="mt-10">
      <div class="space-y-8" id="status-root">
        <form id="status-form" class="glass p-6" novalidate>
          <label for="wl-q" class="font-display text-xl font-semibold">Wallet or X username</label>
          <div class="mt-3 flex flex-col gap-3 sm:flex-row">
            <input id="wl-q" placeholder="0x… or @yourname" autocomplete="off" autocapitalize="none" spellcheck="false" class="field">
            <button type="submit" id="status-submit" class="btn btn-lantern shrink-0" disabled>Check WL Status</button>
          </div>
          <p class="mt-2 text-xs text-current/55">Paste the wallet you submitted, or the X username you applied with.</p>
        </form>
        <div id="status-result" aria-live="polite"></div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
